name: Engine security freshness report
on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/audit-engine.py --output engine-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-security-freshness
          path: engine-audit.json
