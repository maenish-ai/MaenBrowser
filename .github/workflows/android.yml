name: Build MaenBrowser Android preview and release bundle
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The action defaults to retired "tools platform-tools". Request only
          # supported packages; AGP 8.13.2 uses Build Tools 35 with compileSdk 36.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build and verify
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MaenBrowser-Android-validation
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: MaenBrowser-Android-preview-and-UNSIGNED-bundle
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The action defaults to retired "tools platform-tools". Request only
          # supported packages; AGP 8.13.2 uses Build Tools 35 with compileSdk 36.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-device-tests-API-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
