name: Build CEF 152 Maen Media Runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-cef-media:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v5
      - name: Build Chromium CEF media runtime
        shell: pwsh
        run: .\tools\build-cef-media.ps1 -DownloadDir "C:\maen-cef-build" -OutputDir "$env:RUNNER_TEMP\maen-cef-output"
      - name: Verify media build manifest
        shell: pwsh
        run: .\tools\verify-cef-media-build.ps1 -OutputDir "$env:RUNNER_TEMP\maen-cef-output"
      - name: Upload Maen media CEF archive
        uses: actions/upload-artifact@v4
        with:
          name: maen-cef-152-media-windows64
          path: |
            ${{ runner.temp }}\maen-cef-output\maen-cef-152-media-windows64.zip
            ${{ runner.temp }}\maen-cef-output\maen-cef-152-media-windows64.zip.sha256
            ${{ runner.temp }}\maen-cef-output\maen-cef-152-media-build-manifest.txt
          if-no-files-found: error
          retention-days: 90
