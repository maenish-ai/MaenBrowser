name: Build publisher-signed Android bundle (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build with publisher upload key, never debug signing
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MAEN_ANDROID_KEYSTORE: ${{ runner.temp }}/maen-upload.jks
          MAEN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MAEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UPLOAD_KEYSTORE_BASE64 MAEN_ANDROID_STORE_PASSWORD MAEN_ANDROID_KEY_ALIAS MAEN_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing publisher signing secret: $name"; exit 1; fi
          done
          umask 077
          trap 'rm -f "$MAEN_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$MAEN_ANDROID_KEYSTORE"
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/signature-check.txt"
          if ! grep -q 'jar verified' "$RUNNER_TEMP/signature-check.txt"; then echo 'Release bundle signature not verified'; exit 1; fi
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-Android-publisher-signed-AAB
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.sha256
          if-no-files-found: error
