name: Build MaenBrowser Windows
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be semantic x.y.z, got: $version" }
          $cmake = Get-Content CMakeLists.txt -Raw
          $nsi = Get-Content installer/MaenBrowser.nsi -Raw
          $header = Get-Content include/maenbrowser/version.h -Raw
          $e = [regex]::Escape($version)
          if ($cmake -notmatch "project\(MaenBrowser VERSION $e") { throw "CMake version drift: $version" }
          if ($nsi -notmatch ('PRODUCT_VERSION "' + $e + '"')) { throw "NSIS version drift: $version" }
          if ($header -notmatch ('kVersion\[\] = "' + $e + '"')) { throw "Header version drift: $version" }
          "MAEN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Repository preflight
        shell: pwsh
        run: .\tools\preflight.ps1
      - name: Security release gate
        shell: pwsh
        run: |
          $source = (Get-ChildItem src -Recurse -Include *.cpp,*.h | Get-Content -Raw) -join "`n"
          foreach ($flag in @("ignore-certificate-errors","disable-web-security","allow-running-insecure-content")) { if ($source.Contains($flag)) { throw "Blocked insecure setting: $flag" } }
          if (-not $source.Contains("ApplyWindowsProcessHardening")) { throw "Windows process hardening is missing." }
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) { $nsis | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Verify 7-Zip
        shell: pwsh
        run: |
          $sevenZip=(Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and -not (Test-Path "C:\Program Files\7-Zip\7z.exe")) { throw "7-Zip is not available." }
      - name: Require media-enabled CEF
        shell: pwsh
        env:
          MAEN_CEF_ARCHIVE_URL: ${{ vars.MAEN_CEF_ARCHIVE_URL }}
          MAEN_CEF_ARCHIVE_SHA256: ${{ vars.MAEN_CEF_ARCHIVE_SHA256 }}
        run: |
          if (-not $env:MAEN_CEF_ARCHIVE_URL) { throw "Release blocked: MAEN_CEF_ARCHIVE_URL must point to the verified CEF 152 media build." }
          if ($env:MAEN_CEF_ARCHIVE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') { throw "Release blocked: MAEN_CEF_ARCHIVE_SHA256 is missing/invalid." }
          $cefRoot=& .\tools\fetch-cef.ps1
          if (-not $cefRoot) { throw "CEF_ROOT was not returned." }
          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify CEF media runtime integrity
        shell: pwsh
        run: .\tools\verify-media-runtime.ps1 -CefRoot "$env:CEF_ROOT"
      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found." }
          $vs=& $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 C++ x64 toolchain not found." }
          cmake --version
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$env:CEF_ROOT" -DMAEN_ENABLE_UPDATER=OFF -DUSE_SANDBOX=ON
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Stamp MaenBrowser icon into sandbox bootstrap EXE
        shell: pwsh
        run: .\tools\set-exe-icon.ps1 -ExePath "build\Release\MaenBrowser.exe" -IconPath "assets\maenbrowser.ico"
      - name: Verify EXE icon resource
        shell: pwsh
        run: |
          $exe=(Resolve-Path "build\Release\MaenBrowser.exe").Path
          $sig=Get-AuthenticodeSignature $exe
          Write-Host "Icon stamped: $exe"
      - name: Stage runtime
        shell: pwsh
        run: |
          $release="build\Release"
          if (!(Test-Path "$release\MaenBrowser.exe")) { throw "MaenBrowser.exe missing." }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$release\*" dist -Recurse -Force
          if (!(Test-Path "dist\libcef.dll")) { throw "CEF runtime libcef.dll missing." }
      - name: Verify staged browser runtime
        shell: pwsh
        run: |
          foreach ($file in @("dist\MaenBrowser.exe","dist\libcef.dll","dist\icudtl.dat","dist\resources.pak")) { if (!(Test-Path $file)) { throw "Required runtime file missing: $file" } }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location installer
          try { makensis MaenBrowser.nsi } finally { Pop-Location }
          $setup="installer\MaenBrowser-$env:MAEN_VERSION-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Setup
          path: installer/MaenBrowser-${{ env.MAEN_VERSION }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
