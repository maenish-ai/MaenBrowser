name: Build MaenBrowser Windows Setup

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBVIEW2_SDK_VERSION: 1.0.4258.31

jobs:
  build-setup:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        shell: pwsh
        run: |
          "MAEN_VERSION=$((Get-Content VERSION -Raw).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch Microsoft WebView2 SDK
        shell: pwsh
        run: |
          $version=$env:WEBVIEW2_SDK_VERSION
          $pkg="$env:RUNNER_TEMP\webview2.zip"
          $root="$env:RUNNER_TEMP\webview2-sdk"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $pkg
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $pkg -DestinationPath $root -Force
          foreach ($required in @("$root\build\native\include\WebView2.h", "$root\build\native\x64\WebView2LoaderStatic.lib")) {
            if (!(Test-Path $required)) { throw "WebView2 SDK file missing: $required" }
          }
          "WEBVIEW2_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Source regression checks
        shell: pwsh
        run: |
          $source=Get-Content src/webview2_browser/main.cpp -Raw
          if (!$source.Contains('#include <windowsx.h>')) { throw 'Missing GET_X_LPARAM header' }
          if (!$source.Contains('put_NewWindow(tab->view.Get())')) { throw 'Popup tab wiring missing' }
          if (!(Test-Path 'src/win/resource.h')) { throw 'Resource header missing' }
          if (!(Test-Path 'assets/maenbrowser.ico')) { throw 'Icon missing' }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17" -A x64 "-DWEBVIEW2_SDK_ROOT=$env:WEBVIEW2_SDK_ROOT"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stamp MaenBrowser icon
        shell: pwsh
        run: .\tools\set-exe-icon.ps1 -ExePath "build\Release\MaenBrowser.exe" -IconPath "assets\maenbrowser.ico"

      - name: Stage runtime and WebView2 bootstrapper
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\*" dist -Recurse -Force
          foreach ($file in @("dist\MaenBrowser.exe")) {
            if (!(Test-Path $file)) { throw "Required runtime file missing: $file" }
          }
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "dist\MicrosoftEdgeWebview2Setup.exe"
          if ((Get-Item "dist\MicrosoftEdgeWebview2Setup.exe").Length -lt 1000000) { throw "WebView2 bootstrapper download looks invalid." }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location installer
          try { makensis MaenBrowser.nsi } finally { Pop-Location }
          $setup="installer\MaenBrowser-$env:MAEN_VERSION-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }

      - name: Upload Setup only
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Setup
          path: installer/MaenBrowser-${{ env.MAEN_VERSION }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
