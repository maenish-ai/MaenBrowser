name: Build MaenBrowser Windows Setup

on:
  push:
    branches: ["main", "development/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBVIEW2_SDK_VERSION: 1.0.4258.31
  MAEN_CEF_ARCHIVE_URL: ${{ secrets.MAEN_CEF_ARCHIVE_URL }}
  MAEN_CEF_ARCHIVE_SHA256: ${{ secrets.MAEN_CEF_ARCHIVE_SHA256 }}

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      media_ready: ${{ steps.check.outputs.media_ready }}
    steps:
      - name: Check verified CEF archive configuration
        id: check
        shell: bash
        env:
          CEF_ARCHIVE_URL: ${{ secrets.MAEN_CEF_ARCHIVE_URL }}
          CEF_ARCHIVE_SHA256: ${{ secrets.MAEN_CEF_ARCHIVE_SHA256 }}
        run: |
          if [[ "$CEF_ARCHIVE_URL" =~ ^https://[^[:space:]]+$ && "$CEF_ARCHIVE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "media_ready=true" >> "$GITHUB_OUTPUT"
            echo "Verified CEF archive settings are present; Windows Setup validation will run."
          else
            echo "media_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows Setup skipped: configure valid MAEN_CEF_ARCHIVE_URL and MAEN_CEF_ARCHIVE_SHA256 repository secrets to build the verified H.264 runtime."
          fi

  build-setup:
    needs: configuration
    if: needs.configuration.outputs.media_ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript safeguards and package verification
        shell: pwsh
        run: |
          python tools/run-checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source and security
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be semantic x.y.z" }
          "MAEN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          .\tools\preflight.ps1

      - name: Fetch verified media-enabled CEF 152
        shell: pwsh
        run: |
          $cefRoot=& .\tools\fetch-cef.ps1 -RequireMedia
          if (-not $cefRoot) { throw "CEF root was not returned." }
          .\tools\verify-media-runtime.ps1 -CefRoot $cefRoot -RequireMedia
          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch Microsoft WebView2 SDK
        shell: pwsh
        run: |
          $version=$env:WEBVIEW2_SDK_VERSION
          $pkg="$env:RUNNER_TEMP\webview2.zip"
          $root="$env:RUNNER_TEMP\webview2-sdk"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $pkg
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $pkg -DestinationPath $root -Force
          foreach ($required in @("$root\build\native\include\WebView2.h", "$root\build\native\x64\WebView2LoaderStatic.lib")) {
            if (!(Test-Path $required)) { throw "WebView2 SDK file missing: $required" }
          }
          "WEBVIEW2_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17" -A x64 "-DCEF_ROOT=$env:CEF_ROOT" "-DWEBVIEW2_SDK_ROOT=$env:WEBVIEW2_SDK_ROOT" -DMAEN_ENABLE_UPDATER=OFF -DUSE_SANDBOX=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Native domain tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Browser integration and real in-tab H.264 playback test
        timeout-minutes: 8
        shell: pwsh
        run: node tests/browser_smoke.mjs build/Release/MaenBrowser.exe

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-validation-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Release/debug.log
          if-no-files-found: ignore

      - name: Stamp MaenBrowser icon
        shell: pwsh
        run: .\tools\set-exe-icon.ps1 -ExePath "build\Release\MaenBrowser.exe" -IconPath "assets\maenbrowser.ico"

      - name: Stage runtime
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\*" dist -Recurse -Force
          Remove-Item "dist\MaenMediaTests.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\MaenDomainTests.exe" -ErrorAction SilentlyContinue
          foreach ($file in @("dist\MaenBrowser.exe","dist\libcef.dll","dist\icudtl.dat","dist\resources.pak")) {
            if (!(Test-Path $file)) { throw "Required runtime file missing: $file" }
          }
          Remove-Item "dist\MaenNavigationTests.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\MaenExternalTests.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\MaenFilterTests.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\MaenResourceTests.exe" -ErrorAction SilentlyContinue
          Get-ChildItem dist -Recurse -File -Include *.pdb,*.lib,*.exp,*.ilk | Remove-Item -Force
          New-Item -ItemType Directory -Force -Path "dist\notices" | Out-Null
          Copy-Item assets/filters/sources/*LICENSE* dist/notices
          Copy-Item THIRD_PARTY_NOTICES.md dist/notices
          Remove-Item "dist\filters\sources" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "dist\companion" -Filter "background-*.js" | Where-Object { $_.Name -ne "background-1.9.6.js" } | Remove-Item -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location installer
          try { makensis MaenBrowser.nsi; if ($LASTEXITCODE -ne 0) { throw "NSIS failed" } } finally { Pop-Location }
          $setup="installer\MaenBrowser-$env:MAEN_VERSION-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created: $setup" }

      - name: Confirm installer payload
        shell: pwsh
        run: |
          $setup="installer\MaenBrowser-$env:MAEN_VERSION-Setup.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          Write-Host "Setup produced: $setup ($((Get-Item $setup).Length) bytes)"

      - name: Upload Setup only
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Setup
          path: installer/MaenBrowser-${{ env.MAEN_VERSION }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
