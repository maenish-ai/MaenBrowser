name: Build MaenBrowser Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maenbrowser-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "1.5.2") {
            throw "Expected VERSION 1.5.2, got $version"
          }
          "MAEN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Repository preflight
        shell: pwsh
        run: .\tools\preflight.ps1

      - name: Security release gate
        shell: pwsh
        run: |
          $source = (Get-ChildItem src -Recurse -Include *.cpp,*.h | Get-Content -Raw) -join "`n"
          $blocked = @("ignore-certificate-errors","disable-web-security","allow-running-insecure-content")
          foreach ($flag in $blocked) {
            if ($source.Contains($flag)) { throw "Blocked insecure setting: $flag" }
          }
          if (-not $source.Contains("ApplyWindowsProcessHardening")) {
            throw "Windows process hardening is missing."
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) {
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Verify 7-Zip
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and -not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            throw "7-Zip is not available on the runner."
          }

      - name: Download and verify CEF
        shell: pwsh
        run: |
          $cefRoot = & .\tools\fetch-cef.ps1
          if (-not $cefRoot) { throw "CEF_ROOT was not returned." }
          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found." }
          $vs = & $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 C++ x64 toolchain not found." }
          Write-Host "Using Visual Studio 2022: $vs"
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17" `
            -A x64 `
            "-DCEF_ROOT=$env:CEF_ROOT" `
            -DMAEN_ENABLE_UPDATER=OFF `
            -DUSE_SANDBOX=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stamp MaenBrowser icon into sandbox bootstrap EXE
        shell: pwsh
        run: |
          .\tools\set-exe-icon.ps1 `
            -ExePath "build\Release\MaenBrowser.exe" `
            -IconPath "assets\maenbrowser.ico"

      - name: Verify EXE icon resource
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build\Release\MaenBrowser.exe").Path
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Icon stamped into final sandbox bootstrap executable: $exe"

      - name: Stage runtime
        shell: pwsh
        run: |
          $release = "build\Release"
          if (!(Test-Path "$release\MaenBrowser.exe")) {
            throw "MaenBrowser.exe not found after build."
          }

          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$release\*" dist -Recurse -Force

          if (!(Test-Path "dist\libcef.dll")) {
            throw "CEF runtime libcef.dll missing from staged build."
          }

      - name: Verify staged browser runtime
        shell: pwsh
        run: |
          $required = @(
            "dist\MaenBrowser.exe",
            "dist\libcef.dll",
            "dist\icudtl.dat",
            "dist\resources.pak"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required runtime file missing: $file" }
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Push-Location installer
          try {
            makensis MaenBrowser.nsi
          } finally {
            Pop-Location
          }

          if (!(Test-Path "installer\MaenBrowser-1.5.2-Setup.exe")) {
            throw "Installer was not created."
          }

      - name: Package portable runtime
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\* `
            -DestinationPath "MaenBrowser-$env:MAEN_VERSION-Windows-x64-Portable.zip" `
            -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Setup
          path: installer/MaenBrowser-1.5.2-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Portable
          path: MaenBrowser-${{ env.MAEN_VERSION }}-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30
